<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MaeLinne — Shop dashboard</title><link rel="stylesheet" href="/admin.css"></head>
<body><main class="wrap"><header><div><p class="eyebrow">MAELINNE / PRIVATE WORKSPACE</p><h1>Shop dashboard</h1><p>Manage products, sizes, stock and orders.</p></div><a href="/">← View website</a></header>
<div class="notice" role="status" id="status">Connecting securely to your shop…</div>
<section aria-labelledby="products-title"><h2 id="products-title">Products</h2><div id="products"></div><h3>Add a product</h3>
<form id="product-form"><label>Name<input name="name" required maxlength="120" placeholder="e.g. Burgundy lace-trim top"></label><label>Description<textarea name="description" maxlength="2000"></textarea></label><label>Price (€)<input name="price" type="number" min="0" step=".01" required></label><label>Image URL or site asset path<input name="image_url" placeholder="/assets/product.webp"></label><button type="submit">Save product as draft</button></form></section>
<section aria-labelledby="orders-title"><h2 id="orders-title">Orders</h2><p class="hint">Orders will appear here after secure payment integration is completed. This first version cannot accept payments.</p><div id="orders"></div></section>
</main><script src="/admin.js" defer></script></body></html>
