<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MaeLinne — Shop dashboard</title><link rel="stylesheet" href="/admin.css?v=fabric-20261020-2"></head><body><main class="wrap"><header><div><p class="eyebrow">MAELINNE / PRIVATE WORKSPACE</p><h1>Shop dashboard</h1><p>Manage products, sizes, stock and orders.</p></div><a href="/">← View website</a></header><div class="notice" role="status" id="status">Connecting securely…</div><section><h2>Add new product</h2><form id="product-form"><label>Category<select name="category" required><option value="">Choose category</option><option>Tops</option><option>Knitwear</option><option>Bottoms</option><option>Dresses & Skirts</option><option>Sets</option><option>Outerwear</option><option>Sleepwear</option><option>Accessories</option><option>Other</option></select></label><label>Name<input name="name" required maxlength="120" placeholder="e.g. Y2K Lace Henley"></label><label>Colour for this listing<input name="color" maxlength="80" placeholder="e.g. Burgundy"></label><label>Style group (same for other colours)<input name="style_group" maxlength="80" placeholder="e.g. Y2K Lace Henley"></label><label>Material<input name="fabric" maxlength="160" placeholder="e.g. 60% cotton, 35% rayon, 5% elastane"></label><label>Description<textarea name="description" maxlength="2000"></textarea></label><label>Price (€)<input name="price" type="number" min="0" step=".01" required></label><label>Product photos (up to 12)<input id="photo-file" type="file" multiple accept="image/jpeg,image/png,image/webp"></label><p class="hint">JPG, PNG or WebP; maximum 5 MB per photo.</p><label>Photo URL<input id="image-url" name="image_url" readonly placeholder="Filled automatically"></label><div id="photo-preview"></div><button type="submit">Save product as draft</button></form></section><section aria-labelledby="products-title"><h2 id="products-title">Products</h2><div class="hint" id="product-count"></div><div class="catalogue-tools"><label>Search<input id="product-search" type="search" placeholder="Search name, colour or SKU"></label><label>Category<select id="category-filter"><option value="">All categories</option><option>Tops</option><option>Knitwear</option><option>Bottoms</option><option>Dresses & Skirts</option><option>Sets</option><option>Outerwear</option><option>Sleepwear</option><option>Accessories</option><option>Other</option><option>Uncategorised</option></select></label><label>Status<select id="status-filter"><option value="">All</option><option value="draft">Drafts</option><option value="published">Published</option></select></label></div><div id="draft-products"></div><div id="published-products"></div></section><section aria-labelledby="orders-title"><h2 id="orders-title">Orders</h2><p class="hint">Orders appear once payments are integrated; checkout is not yet available.</p><div id="orders"></div></section></main><script src="/admin.js?v=delete-draft-20261020" defer></script></body></html>
