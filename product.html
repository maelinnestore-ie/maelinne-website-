<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MaeLinne — Product photos</title><style>body{font:16px system-ui,sans-serif;background:#f8f0e9;color:#48242a;margin:0}.wrap{max-width:1050px;margin:auto;padding:28px}a{color:inherit}.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(250px,1fr);gap:30px;margin-top:25px}.hero{border:0;background:#fff;cursor:zoom-in;width:100%;padding:0;display:block}.hero img{width:100%;max-height:650px;object-fit:contain}.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.thumbs button{background:#fff;padding:4px;border:2px solid transparent;cursor:pointer}.thumbs button[aria-pressed=true]{border-color:#713e46}.thumbs img{width:76px;height:90px;object-fit:contain}dialog{max-width:96vw;max-height:96vh;background:#fff;border:0;padding:20px}dialog::backdrop{background:#000d}dialog img{max-width:90vw;max-height:80vh;object-fit:contain}button{font:inherit}#close{float:right;margin-bottom:12px;cursor:pointer}@media(max-width:680px){.layout{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="/">← MaeLinne</a><div id="info">Loading product…</div><div class="layout" id="layout" hidden><div><button class="hero" id="big" aria-label="Enlarge product photo"><img id="main-img" alt=""></button><div class="thumbs" id="thumbs"></div><p>Click or tap the main photo to zoom in.</p></div><div><h1 id="name"></h1><p id="color"></p><h2 id="price"></h2><p id="description"></p><div id="sizes"></div><p>Preview only — checkout isn't available yet.</p></div></div></main><dialog id="zoom" aria-label="Enlarged product photo"><button id="close" type="button">Close ×</button><img id="zoom-img" alt=""></dialog><script>
(async()=>{try{const id=new URLSearchParams(location.search).get('id');if(!id)throw Error('No product selected.');const r=await fetch('/api/products');if(!r.ok)throw Error('Catalogue unavailable.');const p=(await r.json()).products.find(x=>x.id===id);if(!p)throw Error('This product is not published yet.');const images=p.images?.length?p.images:p.image_url?[p.image_url]:[];document.getElementById('info').hidden=true;document.getElementById('layout').hidden=false;document.getElementById('name').textContent=p.name;document.getElementById('color').textContent='Choose your size and colour below.';document.getElementById('price').textContent=new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(p.price_cents/100);document.getElementById('description').textContent=p.description||'';document.getElementById('sizes').textContent=p.variants?.length?'Available options: '+p.variants.map(v=>v.label).join(', '):'Sizes coming soon';const main=document.getElementById('main-img'),thumbs=document.getElementById('thumbs');function select(i){main.src=images[i];main.alt=p.name+' — photo '+(i+1);document.getElementById('zoom-img').src=images[i];document.getElementById('zoom-img').alt=main.alt;[...thumbs.children].forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));}images.forEach((url,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','View photo '+(i+1));const im=document.createElement('img');im.src=url;im.alt='';b.append(im);b.onclick=()=>select(i);thumbs.append(b);});if(images.length)select(0);else document.getElementById('big').hidden=true;document.getElementById('big').onclick=()=>document.getElementById('zoom').showModal();document.getElementById('close').onclick=()=>document.getElementById('zoom').close();document.getElementById('zoom').onclick=e=>{if(e.target.id==='zoom')e.target.close();};}catch(e){document.getElementById('info').textContent=e.message;}})();</script></body></html>
