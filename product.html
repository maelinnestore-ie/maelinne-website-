<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MaeLinne — Product details</title><link rel="stylesheet" href="/styles.css"><style>body{font:16px "DM Sans",system-ui,sans-serif;background:#f5efe6;color:#48242a;margin:0}.wrap{max-width:1150px;margin:auto;padding:28px 24px 80px}.back-link{display:inline-block;margin:20px 0;font-size:13px;text-decoration:underline;text-underline-offset:5px}.product-details h1{font:normal clamp(2rem,4vw,3.6rem) "DM Serif Display",Georgia,serif;line-height:1.09;letter-spacing:-.03em;margin:5px 0 16px}.product-details h2{font-size:23px;font-weight:600}.product-details #description{line-height:1.75;white-space:pre-line}.product-details #sizes{border-top:1px solid #decfc3;border-bottom:1px solid #decfc3;padding:24px 0;margin:26px 0}.product-details #color{font-size:13px;letter-spacing:.06em;text-transform:uppercase}.preview-note{font-size:13px;background:#eee3da;padding:16px 20px;color:#73545a}.thumbs button{border-radius:0}.hero img{aspect-ratio:3/4;max-height:680px;object-fit:contain}.logo-head{border-bottom:1px solid #e2d3c7;padding:20px 25px;text-align:center}.logo-head img{max-width:185px;width:55%;height:auto}a{color:inherit}.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(250px,1fr);gap:30px;margin-top:25px}.hero{border:0;background:#fff;cursor:zoom-in;width:100%;padding:0;display:block}.hero img{width:100%;max-height:650px;object-fit:contain}.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.thumbs button{background:#fff;padding:4px;border:2px solid transparent;cursor:pointer}.thumbs button[aria-pressed=true]{border-color:#713e46}.thumbs img{width:76px;height:90px;object-fit:contain}dialog{max-width:96vw;max-height:96vh;background:#fff;border:0;padding:20px}dialog::backdrop{background:#000d}dialog img{max-width:90vw;max-height:80vh;object-fit:contain}button{font:inherit}#close{float:right;margin-bottom:12px;cursor:pointer}@media(max-width:680px){.layout{grid-template-columns:1fr}} .detail-header{border-bottom:1px solid #e2d3c7}.detail-header .wordmark{display:block}@media(max-width:700px){.detail-header{height:auto;min-height:82px;flex-wrap:wrap;justify-content:flex-start;padding:16px;gap:12px}.detail-header .desktop-nav{display:flex;width:100%;justify-content:flex-start;gap:22px;font-size:12px}} .fabric-composition{padding:17px 0;border-top:1px solid #decfc3;font-size:14px;color:#704b51} </style><link rel="stylesheet" href="/commerce.css?v=checkout-20261021"></head><body><header class="site-header detail-header"><a class="wordmark" href="/" aria-label="MaeLinne home"><img src="/maelinne-logo.png" alt="MaeLinne" style="display:block;width:200px;max-width:100%;height:auto"></a><nav class="desktop-nav" aria-label="Main navigation"><a href="/shop.html">New In</a><a href="/shop.html">Shop All</a><a href="/#story">Our Story</a></nav></header><main class="wrap"><a class="back-link" href="/shop.html">← Back to the collection</a><div id="info">Loading product…</div><div class="layout" id="layout" hidden><div><button class="hero" id="big" aria-label="Enlarge product photo"><img id="main-img" alt=""></button><div class="thumbs" id="thumbs"></div><p>Click or tap the main photo to zoom in.</p></div><div class="product-details"><h1 id="name"></h1><p id="color"></p><div id="other-colours"></div><h2 id="price"></h2><p id="description"></p><div id="fabric-composition" class="fabric-composition" hidden></div><div id="sizes"></div><div id="purchase-controls"></div><p class="delivery-note">Ireland delivery €5. Free when items total €40 or more after discounts.</p></div></div></main><dialog id="zoom" aria-label="Enlarged product photo"><button id="close" type="button">Close ×</button><img id="zoom-img" alt=""></dialog><script>
(async()=>{try{const id=new URLSearchParams(location.search).get('id');if(!id)throw Error('No product selected.');const r=await fetch('/api/products');if(!r.ok)throw Error('Catalogue unavailable.');const catalogue=(await r.json()).products;const p=catalogue.find(x=>x.id===id);if(!p)throw Error('This product is not published yet.');const images=p.images?.length?p.images:p.image_url?[p.image_url]:[];document.getElementById('info').hidden=true;document.getElementById('layout').hidden=false;document.getElementById('name').textContent=p.name;document.getElementById('color').textContent=p.color?'Colour: '+p.color:'';if(p.style_group){const other=document.getElementById('other-colours');for(const item of catalogue.filter(x=>x.style_group&&x.style_group.toLowerCase()===p.style_group.toLowerCase()&&x.id!==p.id)){const a=document.createElement('a');a.href='/product.html?id='+encodeURIComponent(item.id);a.textContent=item.color||item.name;a.style.cssText='display:inline-block;margin:5px 8px 12px 0;padding:8px 12px;border:1px solid #94767a;border-radius:30px;text-decoration:none';other.append(a);}}document.getElementById('price').textContent=new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(p.price_cents/100);document.getElementById('description').textContent=p.description||'';const fabricEl=document.getElementById('fabric-composition');if(p.fabric){fabricEl.hidden=false;fabricEl.textContent='Material: '+p.fabric;}document.getElementById('sizes').textContent=p.variants?.length?'Available sizes: '+p.variants.map(v=>v.label).join(', '):'Sizes coming soon';const main=document.getElementById('main-img'),thumbs=document.getElementById('thumbs');function select(i){main.src=images[i];main.alt=p.name+' — photo '+(i+1);document.getElementById('zoom-img').src=images[i];document.getElementById('zoom-img').alt=main.alt;[...thumbs.children].forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));}images.forEach((url,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','View photo '+(i+1));const im=document.createElement('img');im.src=url;im.alt='';b.append(im);b.onclick=()=>select(i);thumbs.append(b);});if(images.length)select(0);else document.getElementById('big').hidden=true;document.getElementById('big').onclick=()=>document.getElementById('zoom').showModal();document.getElementById('close').onclick=()=>document.getElementById('zoom').close();document.getElementById('zoom').onclick=e=>{if(e.target.id==='zoom')e.target.close();};}catch(e){document.getElementById('info').textContent=e.message;}})();</script><script src="/commerce.js?v=checkout-20261021" defer></script></body></html>
