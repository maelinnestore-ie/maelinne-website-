<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5efe6"><title>Shop the drop — MaeLinne</title><link rel="stylesheet" href="/styles.css"><style>body{background:#f5efe6}.catalogue-wrap{max-width:1180px;margin:auto;padding:38px 22px 90px}.catalogue-heading{text-align:center;margin:45px auto 36px}.catalogue-heading h1{font:normal clamp(2.5rem,6vw,5rem) Georgia,serif;color:#481b20}.catalogue-tools{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px}.catalogue-tools input,.catalogue-tools select{padding:12px;border:1px solid #bdaca5;background:#fff9f4;font:inherit;min-width:210px}.real-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:25px}.real-card{background:#fffaf4;padding-bottom:18px;overflow:hidden}.real-card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee1d8}.real-card h2{font:normal 1.35rem Georgia,serif;margin:14px 14px 5px}.real-card p{margin:6px 14px;font-size:.9rem;color:#735a60}.real-card a{color:#481b20;text-decoration:none}.real-card .price{margin:8px 14px;font-weight:700}.real-card .see{display:inline-block;margin:9px 14px 0;border-bottom:1px solid #481b20}.site-note{text-align:center;margin:15px auto 35px;color:#735a60;max-width:720px}.status{padding:30px;background:#fffaf4;text-align:center}@media(max-width:520px){.catalogue-wrap{padding:20px 15px 70px}.real-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.real-card h2{font-size:1.1rem}}</style></head><body><header class="site-header"><a href="/" class="wordmark" aria-label="MaeLinne home"><img src="/maelinne-logo.png" alt="MaeLinne" style="display:block;width:200px;max-width:100%;height:auto"></a><nav class="desktop-nav" aria-label="Main navigation"><a href="/">Home</a><a href="/#story">Our story</a><a href="/#contact">Contact</a></nav></header><main class="catalogue-wrap"><div class="catalogue-heading"><p class="eyebrow">THE FIRST DROP</p><h1>Shop MaeLinne</h1><p class="site-note">Comfortable favourites with a little more TLC. This is a catalogue preview; checkout and payments are not yet enabled.</p></div><div class="catalogue-tools"><input id="search" type="search" placeholder="Search MaeLinne..." aria-label="Search products"><select id="category" aria-label="Filter category"><option value="">All categories</option></select></div><div id="status" class="status">Loading the collection…</div><div id="grid" class="real-grid" aria-live="polite"></div></main><script>
const grid=document.getElementById('grid'),status=document.getElementById('status'),search=document.getElementById('search'),cat=document.getElementById('category');let products=[];const eur=n=>new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(n/100);const el=(tag,txt)=>{const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;return n;};function draw(){grid.replaceChildren();const q=search.value.toLowerCase(),c=cat.value,shown=products.filter(p=>(!c||p.category===c)&&[p.name,p.color,p.description,p.category].join(' ').toLowerCase().includes(q));status.hidden=shown.length>0;status.textContent=products.length?'No products match those filters.':'No published products yet. Publish a draft in the private dashboard to see it here.';for(const p of shown){const card=el('article');card.className='real-card';const link=el('a');link.href='/product.html?id='+encodeURIComponent(p.id);const image=el('img');image.src=p.images?.[0]||p.image_url||'/assets/henley.webp';image.alt=p.name+(p.color?' in '+p.color:'');image.loading='lazy';const title=el('h2',p.name);link.append(image,title);card.append(link);if(p.color)card.append(el('p',p.color));card.append(Object.assign(el('p',eur(p.price_cents)),{className:'price'}));const view=el('a','View details →');view.href=link.href;view.className='see';card.append(view);grid.append(card);}}(async()=>{try{const r=await fetch('/api/products',{cache:'no-store'});if(!r.ok)throw Error('Catalogue not available');products=(await r.json()).products||[];for(const c of [...new Set(products.map(p=>p.category||'Other'))].sort()){const o=el('option',c);o.value=c;cat.append(o);}draw();}catch(e){status.textContent='Unable to load the collection right now.';}})();search.addEventListener('input',draw);cat.addEventListener('change',draw);</script></body></html>
