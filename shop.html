<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5efe6"><title>Shop the drop — MaeLinne</title><link rel="stylesheet" href="/styles.css"><style>body{background:#f5efe6}.catalogue-wrap{max-width:1180px;margin:auto;padding:38px 22px 90px}.catalogue-heading{text-align:center;margin:45px auto 36px}.catalogue-heading h1{font:normal clamp(2.5rem,6vw,5rem) Georgia,serif;color:#481b20}.catalogue-tools{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px}.catalogue-tools input,.catalogue-tools select{padding:12px;border:1px solid #bdaca5;background:#fff9f4;font:inherit;min-width:210px}.real-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:25px}.real-card{background:#fffaf4;padding-bottom:18px;overflow:hidden}.real-card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center top;background:#eee1d8}.real-card h2{font:normal 1.35rem Georgia,serif;margin:14px 14px 5px}.real-card p{margin:6px 14px;font-size:.9rem;color:#735a60}.real-card a{color:#481b20;text-decoration:none}.real-card .price{margin:8px 14px;font-weight:700}.real-card .see{display:inline-block;margin:9px 14px 0;border-bottom:1px solid #481b20}.site-note{text-align:center;margin:15px auto 35px;color:#735a60;max-width:720px}.status{padding:30px;background:#fffaf4;text-align:center}@media(max-width:520px){.catalogue-wrap{padding:20px 15px 70px}.real-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.real-card h2{font-size:1.1rem}} .catalogue-heading{margin:55px auto 46px}.catalogue-heading .eyebrow{letter-spacing:.2em;font-size:11px;color:#87525b}.catalogue-heading h1{font-family:'DM Serif Display',Georgia,serif;letter-spacing:-.035em;margin:12px 0 15px}.site-note{font-size:15px;line-height:1.7}.checkout-note{display:inline-block;color:#79434a;background:#f0e5da;border-radius:30px;padding:9px 19px;font-size:12px;margin-top:5px}.catalogue-tools{align-items:end;padding:22px 0;border-top:1px solid #d8c6bd;border-bottom:1px solid #d8c6bd}.catalogue-tools label{display:grid;gap:8px;font-size:12px;color:#6c4b4e;font-weight:600}.search-field{flex:2}.filter-field{flex:1}.catalogue-tools input,.catalogue-tools select{width:100%;min-width:0;border-radius:4px;outline-offset:3px}.result-count{color:#756668;font-size:13px;margin:20px 0}.real-grid{gap:30px 20px}.real-card{background:transparent;padding:0}.real-card .card-photo{overflow:hidden;position:relative;background:#e9ded3}.real-card .card-photo img{transform-origin:center top;transition:transform .35s ease}.real-card a:hover .card-photo img{transform:scale(1.025)}.real-card h2{font-family:'DM Serif Display',Georgia,serif;font-size:1.25rem;margin:13px 0 4px}.real-card p{margin:5px 0}.real-card .price{margin:9px 0;color:#481b20;font-size:15px}.real-card .see{margin:6px 0 0;font-size:12px;letter-spacing:.02em}.sold-badge{position:absolute;left:12px;top:12px;background:#f6eee8;padding:7px 12px;color:#481b20;font-size:12px}.site-header .desktop-nav a{color:#481b20}@media(max-width:700px){.site-header{height:auto;min-height:82px;flex-wrap:wrap;justify-content:flex-start;padding:16px;gap:12px}.site-header .desktop-nav{display:flex;width:100%;justify-content:flex-start;gap:22px;font-size:12px}.catalogue-heading{margin:30px auto}.catalogue-tools{display:grid;grid-template-columns:1fr 1fr;gap:12px}.catalogue-tools label{font-size:11px}.real-card h2{font-size:1.1rem}.real-grid{gap:22px 13px}}@media(max-width:390px){.catalogue-tools{grid-template-columns:1fr}} .fabric-tag{font-size:12px!important;color:#84525f!important;line-height:1.5}.catalogue-tools{flex-wrap:wrap}.catalogue-tools .filter-field{flex:1;min-width:145px}@media(max-width:700px){.catalogue-tools{grid-template-columns:1fr 1fr}.catalogue-tools .search-field{grid-column:1/-1}}

</style><link rel="stylesheet" href="/commerce.css?v=checkout-20261021"></head><body><header class="site-header"><a href="/" class="wordmark" aria-label="MaeLinne home"><img src="/maelinne-logo.png" alt="MaeLinne" style="display:block;width:200px;max-width:100%;height:auto"></a><nav class="desktop-nav" aria-label="Main navigation"><a href="/shop.html">New In</a><a href="/shop.html">Shop All</a><a href="/#story">Our Story</a></nav></header><main class="catalogue-wrap"><div class="catalogue-heading"><p class="eyebrow">SOFT STUFF. GOOD VIBES.</p><h1>Find your new favourite.</h1><p class="site-note">Easy-to-wear pieces, styled your way. A little Y2K, a lot of comfort.</p><p class="checkout-note">Just browsing for now — checkout opens soon.</p></div><div class="catalogue-tools"><label class="search-field"><span>Looking for something?</span><input id="search" type="search" placeholder="Try Henley, lace, burgundy..." aria-label="Search products"></label><label class="filter-field"><span>Products</span><select id="category" aria-label="Filter category"><option value="">Everything</option></select></label><label class="filter-field"><span>Fabric</span><select id="fabric-filter" aria-label="Filter by fabric"><option value="">All fabrics</option><option value="Cotton">Cotton</option><option value="Linen">Linen</option><option value="Viscose">Viscose / Rayon</option><option value="Modal">Modal</option><option value="Bamboo">Bamboo</option><option value="Wool">Wool</option><option value="Other">Other / blends</option></select></label></div><p id="result-count" class="result-count"></p><div id="status" class="status">Loading the collection…</div><div id="grid" class="real-grid" aria-live="polite"></div></main><script>
const grid=document.getElementById('grid'),status=document.getElementById('status'),search=document.getElementById('search'),cat=document.getElementById('category'),fabricFilter=document.getElementById('fabric-filter');let products=[];const eur=n=>new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(n/100);const el=(tag,txt)=>{const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;return n;};function draw(){grid.replaceChildren();const q=search.value.toLowerCase(),c=cat.value,f=fabricFilter.value,shown=products.filter(p=>(!c||p.category===c)&&(!f||(f==='Other'?(p.fabric&&!/cotton|linen|viscose|rayon|modal|bamboo|wool/i.test(p.fabric)):new RegExp(f==='Viscose'?'viscose|rayon':f,'i').test(p.fabric||'')))&&[p.name,p.color,p.description,p.category,p.fabric].join(' ').toLowerCase().includes(q));document.getElementById('result-count').textContent=shown.length+' '+(shown.length===1?'piece':'pieces');status.hidden=shown.length>0;status.textContent=products.length?'No products match those filters.':'No published products yet. Publish a draft in the private dashboard to see it here.';for(const p of shown){const card=el('article');card.className='real-card';const link=el('a');link.className='card-main';link.href='/product.html?id='+encodeURIComponent(p.id);const image=el('img');image.src=p.images?.[0]||p.image_url||'/assets/henley.webp';image.addEventListener('error',()=>{image.src='/assets/henley.webp';},{once:true});image.alt=p.name+(p.color?' in '+p.color:'');image.loading='lazy';const title=el('h2',p.name);const photo=el('div');photo.className='card-photo';photo.append(image);if(p.variants?.length&&p.variants.every(v=>v.quantity<=0))photo.append(Object.assign(el('span','Sold out'),{className:'sold-badge'}));link.append(photo,title);card.append(link);const colour=el('p',p.color||'');colour.className='card-colour';card.append(colour);const badge=el('p',p.fabric?'Fabric: '+p.fabric:'');badge.className='fabric-tag';card.append(badge);card.append(Object.assign(el('p',eur(p.price_cents)),{className:'price'}));const view=el('a','View details →');view.href=link.href;view.className='see';card.append(view);grid.append(card);}}(async()=>{try{const r=await fetch('/api/products',{cache:'no-store'});if(!r.ok)throw Error('Catalogue not available');products=(await r.json()).products||[];for(const c of [...new Set(products.map(p=>p.category||'Other'))].sort()){const o=el('option',c);o.value=c;cat.append(o);}draw();}catch(e){status.textContent='Unable to load the collection right now.';}})();search.addEventListener('input',draw);cat.addEventListener('change',draw);fabricFilter.addEventListener('change',draw);</script><script src="/commerce.js?v=checkout-20261021" defer></script></body></html>
